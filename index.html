<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MISS BASMA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2a1b7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MISS BASMA">
<style>
html,body{margin:0;height:100%;background:#2a1b7a;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f1f4ff;padding-top:env(safe-area-inset-top)}
#splash{position:fixed;inset:0;display:grid;place-items:center;color:#fff;text-align:center;background:linear-gradient(160deg,#0d1240,#2a1b7a);z-index:2;transition:opacity .5s}
#splash img{width:120px;height:120px;border-radius:28px}
#setup{position:fixed;inset:0;display:none;place-items:center;background:#f1f4ff;z-index:3;padding:20px}
#setup div{background:#fff;border-radius:24px;padding:22px;max-width:420px;box-shadow:0 20px 50px rgba(40,30,140,.2)}
input{width:100%;box-sizing:border-box;padding:12px;border:2px solid #e3e7fb;border-radius:14px;direction:ltr;margin:10px 0}
button{width:100%;padding:12px;border:0;border-radius:14px;background:#2a1b7a;color:#fff;font-weight:800;font-size:1rem}
</style>
</head>
<body>
<div id="splash"><div><img src="icon-192.png" alt=""><h2>MISS BASMA</h2><p>جارٍ التحميل…</p></div></div>
<div id="setup"><div><h3>خطوة واحدة فقط</h3><p>الصقي رابط التطبيق (الذي ينتهي بـ <b dir="ltr">/exec</b>) مرة واحدة:</p><input id="u" placeholder="https://script.google.com/macros/s/.../exec"><button id="go">حفظ وفتح التطبيق</button></div></div>
<script>
/* ضعي رابط تطبيقك هنا بين علامتي التنصيص (ينتهي بـ /exec). اتركيه فارغًا ليطلبه التطبيق عند أول فتح. */
const APP_URL = 'https://script.google.com/macros/s/AKfycbw6RJmbhk3MxLBEPKBHCPwEdUzZV5X7Eo1NFIxTjmqAJVxQ6qOswUC5QBtN0FZm9k39/exec';
function get(){ try { return APP_URL || localStorage.getItem('mb_url') || ''; } catch(e){ return APP_URL; } }
function open_(u){
  const f = document.createElement('iframe');
  f.allow = 'clipboard-write; fullscreen'; f.src = u;
  f.onload = () => { const s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(() => s.remove(), 500); };
  document.body.appendChild(f);
  setTimeout(() => { const s = document.getElementById('splash'); if (s) { s.style.opacity = 0; setTimeout(() => s.remove(), 500); } }, 6000);
}
const u = get();
if (/^https:\/\/script\.google\.com\/.+\/exec/.test(u)) open_(u);
else {
  document.getElementById('splash').remove();
  document.getElementById('setup').style.display = 'grid';
  document.getElementById('go').onclick = () => {
    const v = document.getElementById('u').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(v)) return alert('الرابط غير صحيح — يجب أن ينتهي بـ /exec');
    try { localStorage.setItem('mb_url', v); } catch(e){}
    location.reload();
  };
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
